<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>Tenant · Rent Manager</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="store.js"></script>
  <script src="forms.js"></script>
</head>
<body>
  <div id="hdr" class="hdr"></div>
  <main class="page">
    <div id="info"></div>
    <div id="status"></div>
    <div class="sec"><span>Rent — year view</span></div>
    <div class="monthbar" id="yearbar"></div>
    <div id="months" style="margin-top:.6rem"></div>
    <div class="sec"><span id="pHead">Payments</span></div>
    <div id="pays"></div>
    <div id="rulesBox" hidden><div class="sec"><span>House rules</span></div><div id="rules"></div></div>
    <div id="actions" style="margin-top:1rem"></div>
  </main>
  <button id="fab" class="fab" type="button" aria-label="Add rent" hidden>+</button>
<script>
(() => {
  'use strict';
  const A = App, S = A.store, { $, el, toast } = A;
  const sess = A.requireLogin();
  if (!sess) return;
  const isTenant = sess.role === 'Tenant';
  const qid = new URLSearchParams(location.search).get('id') || '';
  let year = new Date().getFullYear();

  const ord = (n) => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  const kv = (label, value, cls) => el('div', {}, el('small', { text: label }), el('b', { class: cls || '', text: value }));

  function render() {
    const v = S.view(); if (!v) return;
    const t = isTenant ? v.tenants[0] : v.tenants.find((x) => x.id === qid);
    if (!t) { $('info').replaceChildren(el('div', { class: 'empty', text: 'Tenant not found.' })); return; }
    const prop = v.properties.find((p) => p.id === t.property_id) || { name: '', address: '' };
    const today = A.todayKey(), cur = today.slice(0, 7);
    const dep = A.depositInfo(t, v.txns), od = A.outstanding(t, v.txns, today), nd = A.nextDue(t, v.txns, today);
    A.setTitle(isTenant ? 'My rent' : A.tenantLabel(t));

    $('info').replaceChildren(el('div', { class: 'card' },
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:.5rem' },
        el('div', {}, el('b', { text: A.tenantLabel(t) }), el('div', { class: 'note', text: prop.name + (prop.address ? ' · ' + prop.address : '') })), A.chip(t.status)),
      el('div', { class: 'kv', style: 'margin-top:.7rem' },
        kv('Monthly rent', '₹ ' + A.money(t.monthly_rent)), kv('Due date', ord(t.due_day) + ' of every month'),
        kv('Deposit agreed', '₹ ' + A.money(dep.agreed)), kv('Deposit received', '₹ ' + A.money(dep.received)),
        kv('Deposit held', '₹ ' + A.money(dep.held)), kv('Deposit pending', '₹ ' + A.money(dep.pending)),
        kv('Lease start', A.dateLabel(t.lease_start) || '–'), kv('Lease end', t.lease_end ? A.dateLabel(t.lease_end) : 'Ongoing'),
        !isTenant && t.mobile ? el('div', { class: 'wide' }, el('small', { text: 'Mobile' }), el('a', { href: 'tel:+91' + t.mobile, text: t.mobile })) : null,
        !isTenant && t.note ? el('div', { class: 'wide' }, el('small', { text: 'Note' }), el('div', { class: 'note', text: t.note })) : null)));

    const stNow = A.monthStatus(t, cur, A.rentEntriesByMonth(v.txns, t.id)[cur], today);
    $('status').replaceChildren(el('div', { class: 'card' }, el('div', { class: 'kv' },
      el('div', {}, el('small', { text: A.monthLabel(cur, 'long') }), A.chip(stNow.status)),
      kv('This month', stNow.status === 'NA' ? '–' : 'Paid ₹' + A.money(stNow.paid) + ' / ' + A.money(stNow.rent_due)),
      kv('Next due', nd ? A.monthLabel(nd.key, 'my') + ' · ₹' + A.money(nd.balance || nd.rent_due) : (t.status === 'Active' ? 'All settled' : '–')),
      kv('Due date', nd ? A.dateLabel(nd.due_date) : '–'),
      od.amount > 0 ? el('div', { class: 'wide' }, el('small', { text: 'Overdue' }), el('b', { class: 'amt-expense', text: '₹ ' + A.money(od.amount) + ' (' + od.months.map((k) => A.monthLabel(k, 'm')).join(', ') + ')' })) : null)));

    $('yearbar').replaceChildren(
      el('button', { class: 'mb-btn', type: 'button', 'aria-label': 'Previous year', text: '‹', onclick: () => { year--; render(); } }),
      el('div', { class: 'month-pick', style: 'cursor:default', text: String(year) }),
      el('button', { class: 'mb-btn', type: 'button', 'aria-label': 'Next year', text: '›', onclick: () => { year++; render(); } }));
    $('months').replaceChildren(...A.yearTable(t, year, v.txns, today).map((m) => {
      const paidLine = m.entries.length ? 'Paid: ' + m.entries.map((x) => A.dateLabel(x.date).replace(/ \d{4}$/, '') + ' ₹' + A.money(x.amount)).join(' · ') : '';
      return el('div', { class: 'mrow' + (m.key === cur ? ' cur' : ''), style: m.status === 'NA' ? 'opacity:.55' : '' },
        el('div', { class: 'mrow-l' }, el('b', { text: A.monthLabel(m.key, 'long') }),
          el('small', { text: m.status === 'NA' ? 'Outside lease' : 'Due ' + A.dateLabel(m.due_date) }), paidLine ? el('small', { text: paidLine }) : null),
        el('div', { class: 'mrow-r' }, m.status === 'NA' ? '' : '₹' + A.money(m.rent_due),
          m.status === 'NA' ? '' : el('small', { text: m.paid > 0 ? (m.balance > 0 ? 'Balance ₹' + A.money(m.balance) : 'Paid ₹' + A.money(m.paid)) : '' })),
        A.chip(m.status));
    }));

    const pays = A.sortBy(v.txns.filter((x) => x.tenant_id === t.id && x.date.slice(0, 4) === String(year)), (x) => x.date + x.id).reverse();
    $('pHead').textContent = 'Payments in ' + year + ' (' + pays.length + ')';
    $('pays').replaceChildren(...(pays.length ? pays.map((x) => {
      const stt = S.statusOf(x.id), dep_ = x.type.indexOf('Deposit') === 0;
      const attrs = { class: 'row' + (stt === 'failed' ? ' failed' : ''), type: 'button' };
      if (A.canEdit()) attrs.onclick = () => A.forms.openTxn({ edit: x }); else attrs.style = 'cursor:default';
      return el('button', attrs, el('div', { class: 'ico', text: dep_ ? '🔐' : '🏠' }),
        el('div', { class: 'row-main' }, el('div', { class: 'row-title', text: dep_ ? x.type : 'Rent · ' + A.monthLabel(x.rent_month, 'my') }),
          el('div', { class: 'row-sub', text: A.dateLabel(x.date) + (x.note ? ' · ' + x.note.split('\n')[0] : '') })),
        el('div', { class: 'row-side' }, el('div', { class: 'row-amt ' + (dep_ ? 'amt-deposit' : 'amt-rent'), text: (x.type === 'Deposit Refund' ? '-' : '+') + A.money(x.amount) }),
          stt === 'failed' ? el('small', { class: 'st', text: '⚠ Not saved' }) : stt === 'queued' ? el('small', { text: '⏳ Saving…' }) : null));
    }) : [el('div', { class: 'empty', text: 'No payments in ' + year + '.' })]));

    if (isTenant) {
      $('rulesBox').hidden = false;
      $('rules').replaceChildren(...(v.rules.length ? v.rules.map((r, i) => el('div', { class: 'card', style: 'margin-bottom:.4rem' }, el('div', { class: 'pre', style: 'white-space:pre-line', text: (i + 1) + '. ' + r.text }))) : [el('div', { class: 'empty', text: 'No rules added.' })]));
    }
    const act = $('actions'); act.replaceChildren();
    if (A.canEdit()) {
      act.append(el('button', { class: 'btn btn-primary', type: 'button', text: 'Edit tenant', onclick: () => A.forms.openTenant(t) }));
      if (t.status === 'Active') act.append(el('button', { class: 'btn btn-danger', type: 'button', text: 'Close tenancy', onclick: () => A.forms.openClose(t) }));
      $('fab').hidden = false;
    }
    $('fab').onclick = () => A.forms.openTxn({ property_id: t.property_id, tenant_id: t.id, type: 'Rent' });
  }

  async function reload(force) {
    try { await S.load(force); render(); } catch (err) { if (!S.view()) $('info').replaceChildren(el('div', { class: 'empty', text: err.message })); else if (force) throw err; }
  }
  window.addEventListener('rent:change', render);
  A.mountHeader(isTenant ? 'My rent' : 'Tenant', { back: isTenant ? null : 'home.html', onRefresh: async () => { await S.resume(); await reload(true); toast('Refreshed'); } });
  if (S.view()) render(); else $('info').replaceChildren(el('div', { class: 'loading', text: 'Loading…' }));
  S.resume(); reload(false);
})();
</script>
</body>
</html>
