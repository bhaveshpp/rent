<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>Rent Manager</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
</head>
<body>
  <div class="hdr"><div class="hdr-bar"><h1 class="hdr-title">🏠 Rent Manager</h1></div></div>
  <main class="page">
    <section class="card" style="margin-top:1rem">
      <h2 style="margin:0 0 .2rem">Login</h2>
      <form id="form" novalidate>
        <label class="lbl" for="m">Mobile number</label>
        <input id="m" class="field" type="tel" inputmode="numeric" autocomplete="username" maxlength="14" required>
        <label class="lbl" for="p">Password</label>
        <input id="p" class="field" type="password" autocomplete="current-password" required>
        <button id="btn" class="btn btn-primary" type="submit">Login</button>
      </form>
      <p class="note" style="margin-top:.8rem">Forgot your password? Ask the owner to reset it.</p>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const { $, api, saveSession, loadSession, setBusy, toast, showFlash } = App;
  const s0 = loadSession();
  if (s0) { location.replace(App.homePage(s0.role)); return; }
  showFlash();
  $('m').focus();
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mobile = $('m').value.replace(/\D/g, '').slice(-10), password = $('p').value;
    if (mobile.length !== 10 || !password) { toast('Enter your 10-digit mobile number and password.', 'error'); return; }
    setBusy($('btn'), true);
    try {
      const d = await api('login', { mobile, password });
      saveSession({ mobile: d.user.mobile, name: d.user.name, role: d.user.role, token: d.token, exp: d.expires });
      App.flash('Welcome ' + d.user.name + '!');
      location.replace(App.homePage(d.user.role));
    } catch (err) {
      toast(err.code === 'invalid_credentials' ? 'Wrong mobile number or password.' : err.message, 'error');
      setBusy($('btn'), false);
    }
  });
})();
</script>
</body>
</html>
