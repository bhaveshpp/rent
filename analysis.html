<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>Analysis · Rent Manager</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <div id="hdr" class="hdr"></div>
  <main class="page">
    <div id="range" class="range-box"></div>
    <div class="summary">
      <div class="sum"><small>Rent</small><b id="sRent" class="amt-rent">0</b></div>
      <div class="sum"><small>Expense</small><b id="sExp" class="amt-expense">0</b></div>
      <div class="sum"><small>Payout</small><b id="sPay" class="amt-payout">0</b></div>
    </div>
    <div class="net"><span>Left in hand (Rent − Expense − Payout)</span><span id="net">0</span></div>
    <div class="sec"><span>Property-wise</span></div>
    <div id="props"></div>
    <div class="sec"><span>Tenant-wise (rent received)</span></div>
    <div id="tenants"></div>
  </main>
  <nav id="nav" class="nav"></nav>
<script>
(() => {
  'use strict';
  const A = App, S = A.store, { $, el, toast } = A;
  if (!A.requireLogin({ admin: true })) return;
  const rng = A.newRangeState();

  function render() {
    const v = S.view(); if (!v) return;
    const r = A.rangeOf(rng), a = A.analyze(v, r.from, r.to);
    $('sRent').textContent = A.money(a.total.rent); $('sExp').textContent = A.money(a.total.expense); $('sPay').textContent = A.money(a.total.payout);
    $('net').textContent = (a.total.net > 0 ? '+' : '') + A.money(a.total.net); $('net').className = a.total.net >= 0 ? 'amt-rent' : 'amt-expense';

    const head = (cols) => el('div', { class: 'tgrid head' }, ...cols.map((c) => el('span', { text: c })));
    $('props').replaceChildren(...(a.props.length ? [head(['Property', 'Rent', 'Expense', 'Payout']),
      ...a.props.map((p) => el('a', { class: 'row tgrid', href: 'property.html?id=' + encodeURIComponent(p.id), style: 'text-decoration:none;color:inherit;' + (p.status !== 'Active' ? 'opacity:.6' : '') },
        el('span', {}, el('b', { text: p.name }), el('small', { class: 'note', style: 'display:block', text: 'Left ' + (p.net >= 0 ? '' : '-') + '₹' + A.money(Math.abs(p.net)) })),
        el('span', { class: p.rent ? 'amt-rent' : 'z', text: p.rent ? A.money(p.rent) : '–' }), el('span', { class: p.expense ? 'amt-expense' : 'z', text: p.expense ? A.money(p.expense) : '–' }), el('span', { class: p.payout ? 'amt-payout' : 'z', text: p.payout ? A.money(p.payout) : '–' })))]
      : [el('div', { class: 'empty', text: 'No properties yet.' })]));

    const propName = (id) => (v.properties.find((p) => p.id === id) || { name: '' }).name;
    const rows = A.sortBy(a.tenants, (t) => propName(t.property_id).toLowerCase() + t.name.toLowerCase());
    $('tenants').replaceChildren(...(rows.length ? rows.map((t) => el('a', { class: 'row', href: 'tenant.html?id=' + encodeURIComponent(t.id), style: 'text-decoration:none' },
      el('div', { class: 'ico', text: '👤' }),
      el('div', { class: 'row-main' }, el('div', { class: 'row-title', text: A.tenantLabel(t) }), el('div', { class: 'row-sub', text: propName(t.property_id) + (t.status === 'Active' ? '' : ' · Old tenant') })),
      el('div', { class: 'row-amt ' + (t.rent_received ? 'amt-rent' : ''), text: t.rent_received ? A.money(t.rent_received) : '–' }))) : [el('div', { class: 'empty', text: 'No tenants yet.' })]));
  }

  async function reload(force) {
    try { await S.load(force); render(); } catch (err) { if (!S.view()) $('props').replaceChildren(el('div', { class: 'empty', text: err.message })); else if (force) throw err; }
  }
  window.addEventListener('rent:change', render);
  A.mountHeader('📊 Analysis', { onRefresh: async () => { await S.resume(); await reload(true); toast('Refreshed'); } });
  A.mountNav('analysis');
  A.mountRange($('range'), rng, render);
  if (S.view()) render(); else $('props').replaceChildren(el('div', { class: 'loading', text: 'Loading…' }));
  S.resume(); reload(false);
})();
</script>
</body>
</html>
